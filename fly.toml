app = "resume-ats-bot"
primary_region = "sin"   # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_BASE_URL = "https://api.groq.com/openai/v1"
  LLM_MODEL    = "llama-3.3-70b-versatile"

# Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME, LLM_API_KEY)
# must be set via: flyctl secrets set KEY=VALUE

[[services]]
  internal_port = 8080
  protocol      = "tcp"

  [[services.ports]]
    port = 80

  [services.concurrency]
    hard_limit = 10
    soft_limit = 5

[checks]
  [checks.alive]
    type     = "tcp"
    interval = "30s"
    timeout  = "5s"

# Use the smallest free VM — 256MB is enough for this bot
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
